name: Build Android
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into project layout
        run: |
          mkdir -p android
          for f in *__*; do
            p="android/${f//__//}"
            mkdir -p "$(dirname "$p")"
            mv "$f" "$p"
          done
          mv settings.gradle build.gradle gradle.properties android/
          find android -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          mkdir -p out
          set -o pipefail
          gradle --no-daemon -p android assembleDebug 2>&1 | tee out/build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PhoneCast-TV.apk

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCast-TV
          path: out/
          if-no-files-found: warn
